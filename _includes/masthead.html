{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
      <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <g stroke-width="2.2">
          <line x1="12" y1="8" x2="12" y2="3.2"/>
          <line x1="12" y1="8" x2="16.4" y2="4.8"/>
          <line x1="12" y1="8" x2="17.6" y2="8.6"/>
          <line x1="12" y1="8" x2="16" y2="12.4"/>
          <line x1="12" y1="8" x2="8" y2="12.4"/>
          <line x1="12" y1="8" x2="6.4" y2="8.6"/>
          <line x1="12" y1="8" x2="7.6" y2="4.8"/>
        </g>
        <circle cx="12" cy="8" r="2" stroke-width="1.4"/>
        <line x1="12" y1="10" x2="12" y2="21" stroke-width="1.4"/>
        <path d="M12 16c-1.6 0-2.6 1-3.2 2.2" stroke-width="1.4"/>
      </svg>
      <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <path d="M4 1.5a3.4 3.4 0 1 0 2.3 5.7 3.9 3.9 0 0 1-2.3-5.7z" stroke-width="1.4"/>
        <circle cx="10" cy="3" r="0.5" fill="currentColor" stroke="none"/>
        <g stroke-width="2.2" transform="rotate(110 15 9)">
          <line x1="15" y1="9" x2="15" y2="4.2"/>
          <line x1="15" y1="9" x2="19.4" y2="5.8"/>
          <line x1="15" y1="9" x2="20.6" y2="9.6"/>
          <line x1="15" y1="9" x2="19" y2="13.4"/>
          <line x1="15" y1="9" x2="11" y2="13.4"/>
          <line x1="15" y1="9" x2="9.4" y2="9.6"/>
          <line x1="15" y1="9" x2="10.6" y2="5.8"/>
        </g>
        <circle cx="15" cy="9" r="2" stroke-width="1.4" transform="rotate(110 15 9)"/>      </svg>
    </button>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('theme-toggle');
    btn.addEventListener('click', function () {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  });
</script>
