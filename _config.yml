# Site settings
minimal_mistakes_skin    : "air"

locale                   : "en-US"
title                    : "Welcome"
title_separator          : "-"
name                     : &name "Anna Schmid"
description              : &description "personal description"
url                      : https://anna-schmid.github.io
baseurl                  : ""
repository               : "anna-schmid/anna-schmid.github.io"
teaser                   : ""
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"

# SEO / research visibility
google_site_verification :

# Reading files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - Gemfile
  - LICENSE
  - README
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: America/Los_Angeles

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development

# Site author
author:
  name             : "Anna Schmid, PhD"
  avatar           : "2025_git.png"
  bio              : "Where Code Meets Compassion | Climate Economics Researcher | Data Analyst"
  email            : "annaelenaschmid@gmail.com"
  github           : "anna-schmid"
  instagram        : "anbanael"
  linkedin         : "anbanael"
  soundcloud       : "anbanael"
  orcid            :
  googlescholar    :
  researchgate     :
  pubmed           :
